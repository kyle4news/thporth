<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Highlights TV</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #player {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: auto;
      z-index: 0;
    }

    #player iframe {
      width: 100%;
      height: 100%;
      pointer-events: auto;
      border: 0;
    }

  </style>
</head>
<body>
  <div id="player" aria-hidden="true"></div>

  <script>
    // Add your block playlist IDs in the order you want them to run.
    const PLAYLISTS = [
       "https://youtube.com/playlist?list=PLL-lmlkrmJak3neKKEataBelAVfdkBbDX&si=ZjpOv-CqqiF_GJZW",
      "https://youtube.com/playlist?list=PL1NbHSfosBuFyu867mbHHhB2G6fx7jtiH&si=y78bpA5AJbfiFgGj",
      "https://youtube.com/playlist?list=PLlVlyGVtvuVlek5UOvwJaRDtuAI1FgGZf&si=gAqvPL84z218wrNh",
      "https://youtube.com/playlist?list=PLQ_voP4Q3cfetksvjNLOrMr3h8xtViMuP&si=EpVT2z2j10l-bTud",
      "https://youtube.com/playlist?list=PLcj4z4KsbIoXrLpj2pOVr_maRaxhW902-&si=-vw72pwX-EDC3QwA",
      "https://youtube.com/playlist?list=PLBBzZXcG8cYCWs68JO69dvmN3e6FhH6nj&si=lWAgVNekoZeJZEq2",
      "https://youtube.com/playlist?list=PLBBzZXcG8cYCQ3lmDu17GHYi2MAomA-aH&si=SPaW4rYaikWFy82L",
    ];

    const YOUTUBE_DATA_API_KEY = "AIzaSyBBxQEZc7DkKtc-1rlKLk9jvLL2D-XJ4mk";
    const PLAYLIST_IDS = PLAYLISTS.map(normalizePlaylistId).filter(Boolean);
    const PROGRAM_SLOT_SECONDS = 300;

    let blockIndex = 0;
    let player;
    let pendingAdvance = false;
    let pendingSeedIndex = 0;
    let currentBlockVideoIds = [];
    let blockLoadToken = 0;

    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      if (!Array.isArray(PLAYLIST_IDS) || PLAYLIST_IDS.length === 0) {
        console.error("No playlists configured in PLAYLISTS.");
        return;
      }

      player = new YT.Player("player", {
        playerVars: {
          autoplay: 1,
          mute: 1,
          controls: 1,
          disablekb: 0,
          fs: 1,
          iv_load_policy: 3,
          modestbranding: 1,
          rel: 0,
          playsinline: 1,
          loop: 0,
          listType: "playlist",
          list: PLAYLIST_IDS[0]
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onStateChange,
          onError: onPlayerError
        }
      });
    }

    function onPlayerReady() {
      try {
        player.mute();
      } catch (error) {
        console.error("Failed to initialize player:", error);
      }

      seedBlockStartFromClock();
      loadCurrentBlock();
    }

    function onStateChange(event) {
      if (event.data !== YT.PlayerState.ENDED) {
        return;
      }

      if (isAtLastVideoInPlaylist()) {
        advanceBlock();
      }
      // Otherwise let YouTube continue to the next video in the same playlist naturally.
    }

    function onPlayerError(event) {
      const errorCode = event && typeof event.data !== "undefined" ? Number(event.data) : NaN;
      console.warn("YouTube player error:", errorCode);
      // Do not force-skip here. Ad transitions and transient player issues can
      // surface as errors, and advancing manually causes the exact jump the
      // user is seeing. Let the native YouTube playlist flow recover first.
    }

    async function loadCurrentBlock() {
      if (!player || PLAYLIST_IDS.length === 0) {
        return;
      }

      const loadToken = ++blockLoadToken;
      const playlistId = PLAYLIST_IDS[blockIndex];

      try {
        currentBlockVideoIds = await getDateFilteredVideoIds(playlistId);

        if (loadToken !== blockLoadToken) {
          return;
        }

        if (!currentBlockVideoIds.length) {
          queueAdvanceBlock();
          return;
        }

        pendingSeedIndex = getSeededVideoIndex(currentBlockVideoIds.length);

        player.loadPlaylist(currentBlockVideoIds, pendingSeedIndex, 0);
      } catch (error) {
        console.error("Failed loading playlist block:", error);
        queueAdvanceBlock();
      }
    }

    function queueAdvanceBlock() {
      if (pendingAdvance) {
        return;
      }

      pendingAdvance = true;
      setTimeout(() => {
        pendingAdvance = false;
        advanceBlock();
      }, 300);
    }

    function advanceBlock() {
      if (!player || PLAYLIST_IDS.length === 0) {
        return;
      }

      blockIndex = (blockIndex + 1) % PLAYLIST_IDS.length;

      loadCurrentBlock();
    }

    async function getDateFilteredVideoIds(playlistId) {
      if (!YOUTUBE_DATA_API_KEY || YOUTUBE_DATA_API_KEY === "REPLACE_WITH_YOUR_YOUTUBE_DATA_API_KEY") {
        throw new Error("Set YOUTUBE_DATA_API_KEY to use date filtering.");
      }

      const items = await fetchAllPlaylistItems(playlistId);
      const allowedDateKeys = getAllowedDateKeys();

      return items
        .filter((item) => {
          const publishedAt = item?.snippet?.publishedAt;
          if (!publishedAt) {
            return false;
          }

          const key = toLocalDateKey(new Date(publishedAt));
          return allowedDateKeys.has(key);
        })
        .map((item) => item?.snippet?.resourceId?.videoId)
        .filter(Boolean);
    }

    async function fetchAllPlaylistItems(playlistId) {
      const allItems = [];
      let nextPageToken = "";

      do {
        const params = new URLSearchParams({
          part: "snippet",
          maxResults: "50",
          playlistId,
          key: YOUTUBE_DATA_API_KEY
        });

        if (nextPageToken) {
          params.set("pageToken", nextPageToken);
        }

        const response = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?${params.toString()}`);
        if (!response.ok) {
          throw new Error(`YouTube Data API error ${response.status}`);
        }

        const payload = await response.json();
        if (Array.isArray(payload.items)) {
          allItems.push(...payload.items);
        }

        nextPageToken = payload.nextPageToken || "";
      } while (nextPageToken);

      return allItems;
    }

    function normalizePlaylistId(value) {
      const raw = String(value || "").trim();
      if (!raw) {
        return "";
      }

      // Already a plain playlist ID (e.g., PLxxxxxx)
      if (!/^https?:\/\//i.test(raw)) {
        return raw;
      }

      try {
        const parsed = new URL(raw);
        return parsed.searchParams.get("list") || "";
      } catch {
        return "";
      }
    }

    function getProgramSlot() {
      return Math.floor(Date.now() / (PROGRAM_SLOT_SECONDS * 1000));
    }

    function seedBlockStartFromClock() {
      if (!PLAYLIST_IDS.length) {
        blockIndex = 0;
        return;
      }

      blockIndex = getProgramSlot() % PLAYLIST_IDS.length;
    }

    function getSeededVideoIndex(videoCount) {
      if (!videoCount || videoCount < 1) {
        return 0;
      }

      // Use a different slot cadence than block selection so starts vary through the day.
      const slot = getProgramSlot();
      const blockCycleSize = Math.max(1, PLAYLIST_IDS.length);
      return Math.floor(slot / blockCycleSize) % videoCount;
    }

    function isAtLastVideoInPlaylist() {
      const playlist = safeGetPlaylist();
      if (!playlist.length) {
        return true;
      }

      const currentIndex = safeGetPlaylistIndex();
      return currentIndex >= playlist.length - 1;
    }

    function safeGetPlaylist() {
      try {
        return player && typeof player.getPlaylist === "function"
          ? player.getPlaylist() || []
          : [];
      } catch {
        return [];
      }
    }

    function safeGetPlaylistIndex() {
      try {
        return player && typeof player.getPlaylistIndex === "function"
          ? Number(player.getPlaylistIndex())
          : 0;
      } catch {
        return 0;
      }
    }

    function getAllowedDateKeys() {
      const now = new Date();
      const today = toLocalDateKey(now);

      const yesterdayDate = new Date(now);
      yesterdayDate.setDate(now.getDate() - 1);
      const yesterday = toLocalDateKey(yesterdayDate);

      return new Set([today, yesterday]);
    }

    function toLocalDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

  </script>
</body>
</html>
